
<!DOCTYPE html>
<html>
<head>
  <title>Sakib App</title>
</head>
<body>
  <h1 id="greeting">Loading...</h1>

  <input type="text" id="nameInput" placeholder="Enter new name" />
  <button onclick="changeName()">Change Name</button>

  <script>
    async function loadName() {
      try {
        const res = await fetch('http://localhost:3000/api/name');
        const data = await res.json();
        document.getElementById('greeting').innerText =
          `Hello ${data.name}. Would you like to change your name for this session?`;
      } catch (err) {
        console.error(err);
      }
    }

    async function changeName() {
      const newName = document.getElementById('nameInput').value;

      await fetch('http://localhost:3000/api/name', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name: newName })
      });

      loadName();
    }

    loadName();
  </script>
</body>
</html>
